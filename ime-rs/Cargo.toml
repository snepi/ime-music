[package]
name = "ime-music-rs"
version = "1.3.2"
edition = "2021"
description = "IMe Music rewritten in Rust. Runs beside the Electron app."
publish = false

[[bin]]
name = "ime-music-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.7.9", features = ["multipart", "form"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"
tokio = { version = "=1.42.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net"] }
tower-http = { version = "=0.6.2", features = ["fs"] }
walkdir = "=2.5.0"
urlencoding = "=2.1.3"
# Pins so the tree builds on Rust 1.83 (newer releases need edition 2024).
hyper = "=1.5.2"
hyper-util = "=0.1.10"
encoding_rs = "=0.8.35"
http = "=1.2.0"
bytes = "=1.9.0"
http-body = "=1.0.1"
http-body-util = "=0.1.2"
tokio-util = "=0.7.13"
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }
# url 2.5.7+ pulls idna 1.1 / icu_provider 2, which need Rust edition 2024.
url = "=2.5.4"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
icu_normalizer = "=1.5.0"
icu_properties = "=1.5.1"
icu_provider = "=1.5.0"
zeroize = "=1.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.28.0"
windows = { version = "=0.52.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
